# ---------------------------------------------------------------------------
# Site identity
# ---------------------------------------------------------------------------
title: "Mercantile Disquisition"

# The homepage <h1>. Deliberately not the site title: the masthead already
# carries the name, so the heading says what the writing is about instead.
masthead_heading: "Where Business Plans Meet the Laws of Physics"
tagline: "Long-form essays on what makes an industry possible, and what quietly makes it impossible"
description: >-
  Deep-dive, research-driven essays on the economics of physical systems:
  energy, agriculture, logistics, and the industries that quietly run on
  thermodynamics rather than press releases.
author:
  name: "Evan"
  email: "evanthewebdev@gmail.com"

# Set these to the site's real production values before deploying.
url: "https://righteoushundred.github.io"
baseurl: "/blog"

lang: en_US
timezone: America/Los_Angeles

# ---------------------------------------------------------------------------
# Theme
# ---------------------------------------------------------------------------
# No gem theme. Layouts live in _layouts/ and the stylesheet in
# assets/css/style.css — a single hand-written file, no Sass, no build step.

# ---------------------------------------------------------------------------
# Plugins
# ---------------------------------------------------------------------------
plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

# ---------------------------------------------------------------------------
# jekyll-seo-tag
# Emits <title>, canonical URLs, Open Graph, Twitter cards, and JSON-LD
# schema.org markup. The JSON-LD block is the part that matters for AI
# crawlers: it hands them a machine-readable description of every page
# instead of making them infer one from the HTML.
# ---------------------------------------------------------------------------
social:
  name: "Evan"
  links:
    - "https://github.com/RighteousHundred"

webmaster_verifications:
  google: ""
  bing: ""

twitter:
  username: ""
  card: summary_large_image

logo: ""

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: "Evan"
      seo:
        type: BlogPosting
  - scope:
      path: ""
      type: pages
    values:
      layout: page

# ---------------------------------------------------------------------------
# jekyll-feed
# Publishes an Atom feed at /feed.xml plus one feed per category, so a
# crawler can pull the full corpus without walking the HTML index.
# ---------------------------------------------------------------------------
feed:
  path: feed.xml
  posts_limit: 100
  excerpt_only: false
  categories:
    - economics
    - energy
    - infrastructure

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------
markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/
excerpt_separator: "<!--more-->"

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  toc_levels: 2..3
  syntax_highlighter: rouge

sass:
  style: compressed

include:
  - robots.txt

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - README.md
  - .sass-cache
  - .jekyll-cache
