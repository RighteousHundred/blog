<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#211f1d">

  <!-- Apply the stored theme before first paint so there is no flash. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>

  {%- seo -%}
  {%- feed_meta -%}

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&display=swap">

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body>

  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="shell">
      <a class="site-mark" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <button class="theme-toggle" type="button"
              aria-label="Toggle light and dark theme" aria-pressed="false"></button>
    </div>
  </header>

  <main id="main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="shell">
      <div class="column">
        <p class="footer-line">&copy; {{ 'now' | date: "%Y" }} {{ site.author.name | default: site.title }}</p>
        <p class="footer-line">
          Open to machine readers &middot;
          <a href="{{ '/feed.xml' | relative_url }}">Atom</a> &middot;
          <a href="{{ '/sitemap.xml' | relative_url }}">Sitemap</a> &middot;
          <a href="{{ '/robots.txt' | relative_url }}">robots.txt</a>
        </p>
      </div>
    </div>
  </footer>

  <script>
    (function () {
      var btn = document.querySelector('.theme-toggle');
      if (!btn) return;
      var root = document.documentElement;
      function current() {
        return root.getAttribute('data-theme') || 'dark';
      }
      function sync() {
        btn.setAttribute('aria-pressed', current() === 'light' ? 'true' : 'false');
      }
      sync();
      btn.addEventListener('click', function () {
        var next = current() === 'light' ? 'dark' : 'light';
        root.setAttribute('data-theme', next);
        try { localStorage.setItem('theme', next); } catch (e) {}
        sync();
      });
    })();
  </script>

</body>
</html>
